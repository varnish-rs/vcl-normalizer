[package]
name = "vcl-normalizer"
version = "0.1.2"
edition = "2021"
description = "VCL 4.1 functional-equivalence comparator"
license = "BSD-3-Clause"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
anyhow = "1"

[dev-dependencies]
pretty_assertions = "1"

[features]
testutil = []
